<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI大模型深度报告 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ["class"],
        theme: {
          extend: {
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
              secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
              destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))" },
              muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
              accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
              card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-background text-foreground h-screen w-screen flex flex-col p-4 md:p-6 gap-6 overflow-hidden">
    
    <!-- Header -->
    <div class="flex justify-between items-end shrink-0 px-2">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight">AI 枢纽 2026：全球顶级大模型全景图</h1>
            <p class="text-sm text-muted-foreground mt-2 font-medium">数据截至2026下半年 | 综合排名与资费全景概览</p>
        </div>
    </div>

    <!-- Main Layout (Full height flex with internal scroll) -->
    <div class="flex-1 grid grid-cols-1 xl:grid-cols-[33%_67%] gap-6 min-h-0">
        
        <!-- Left Column: Top 50 -->
        <div class="rounded-xl border bg-card text-card-foreground shadow-sm flex flex-col min-h-0 relative overflow-hidden">
            <div class="px-6 py-4 border-b shrink-0 bg-muted/10 backdrop-blur-sm z-20 flex justify-between items-center">
                <h3 class="text-lg font-bold">🏆 全球最强 AI 模型综合能力排名（截至2026下半年）</h3>
                <a href="https://huggingface.co/spaces/lmarena-ai/arena-leaderboard" target="_blank" class="text-[10px] text-muted-foreground hover:text-foreground bg-muted px-2 py-1 rounded shadow-sm border transition-colors hover:bg-muted/80" title="访问 LMSYS Leaderboard">来源：arena-leaderboard</a>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar relative z-0">
                <table class="w-full text-sm">
                    <thead class="[&_tr]:border-b sticky top-0 bg-card/95 backdrop-blur z-10 shadow-sm">
                        <tr class="text-muted-foreground">
                            <th class="h-8 px-2 text-center font-medium w-12">排名</th>
                            <th class="h-8 px-2 text-left font-medium w-24">厂商</th>
                            <th class="h-8 px-2 text-left font-medium w-auto">模型名称</th>
                            <th class="h-8 px-2 text-left font-medium w-20">综合 Score</th>
                        </tr>
                    </thead>
                    <tbody id="top50-tbody" class="[&_tr:last-child]:border-0">
                        <!-- JS Inject -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right Column: Unified Pricing & Plans -->
        <div class="rounded-xl border bg-card text-card-foreground shadow-sm flex flex-col min-h-0 relative overflow-hidden">
            <div class="px-6 py-4 border-b shrink-0 bg-muted/10 backdrop-blur-sm z-20">
                <h3 class="text-lg font-bold">💳 API 计费 & 订阅套餐总览</h3>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar relative z-0">
                <table class="w-full text-sm">
                    <thead class="[&_tr]:border-b sticky top-0 bg-card/95 backdrop-blur z-10 shadow-sm">
                        <tr class="text-muted-foreground">
                            <th class="h-8 px-6 text-left font-medium">厂商</th>
                            <th class="h-8 px-4 text-left font-medium w-20">类型</th>
                            <th class="h-8 px-4 text-left font-medium">产品 / 模型</th>
                            <th class="h-8 px-4 text-left font-medium whitespace-nowrap">输入 (¥/1M)</th>
                            <th class="h-8 px-4 text-left font-medium whitespace-nowrap">输出 / 月租</th>
                            <th class="h-8 px-6 text-left font-medium max-w-[250px]">核心权益 / 备注</th>
                        </tr>
                    </thead>
                    <tbody id="unified-pricing-tbody" class="[&_tr:last-child]:border-0">
                        <!-- JS Inject -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
