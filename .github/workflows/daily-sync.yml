    name: Daily Data Sync
    
    on:
      schedule:
        - cron: '0 2 * * *'
      workflow_dispatch:
    
    jobs:
      sync-and-deploy:
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
            with:
              fetch-depth: 0
    
          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.10'
    
          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install pandas gradio_client          
    
          - name: Run LMSYS Data Sync Script
            run: python scripts/sync_lmsys.py
    
          - name: Build Web Assets
            run: |
              cd website
              python3 build_worker.py          

          - name: Commit and Push Changes to Master
            run: |
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add .
              git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily auto-sync leaderboard" && git push origin master)          

          - name: Deploy to GitHub Pages (gh-pages branch)
            run: |
              git checkout gh-pages
              git checkout master -- website/
              cp -r website/* .
              rm -rf website/
              git add .
              git diff --quiet && git diff --staged --quiet || (git commit -m "sync: auto-deploy updated data to gh-pages" && git push origin gh-pages)
              
